name: Build Clean APK with Icon 

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova & Build APK with Icon
        run: |
          npm install -g cordova
          
          # 1. Create Cordova project with Lyramoon 
          cordova create app com.vibe5.nexura "VIBE 4"
          
          # 2. Copy Web Source
          cp index.html app/www/
          
          # 3. Add Custom Icon to Config if icon.png exists
          if [ -f "icon.png" ]; then
            cp icon.png app/www/icon.png
            sed -i '/<\/widget>/i \    <icon src="www/icon.png" />' app/config.xml
          fi
          
          # 4. Add Android Platform & Build
          cd app
          cordova platform add android
          cordova build android --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VIBE-APP-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
