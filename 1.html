<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #080808;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(212, 175, 55, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.08) 0%, transparent 40%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 15px; /* Mobile par spacing dene ke liye */
            overflow-y: auto;   /* Scrollbar enable karne ke liye */
        }

        /* Luxury Container Card */
        .royal-container {
            background: rgba(18, 18, 18, 0.85);
            border: 2px solid #d4af37;
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.25), inset 0 0 15px rgba(212, 175, 55, 0.1);
            text-align: center;
            width: 100%;
            max-width: 420px; /* Mobile par screen se bahar nahi jayega */
            backdrop-filter: blur(10px);
            margin: auto;
        }

        /* Branding */
        .brand-title {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #bf953f, #fcf6ba, #b38728, #fbf5b7, #aa771c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
            margin-bottom: 5px;
        }

        .creator-tag {
            font-size: 0.85rem;
            color: #d4af37;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 25px;
            font-weight: 600;
            border-bottom: 1px solid rgba(212, 175, 55, 0.3);
            display: inline-block;
            padding-bottom: 6px;
        }

        /* Modern Buttons Layout */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .royal-btn {
            position: relative;
            background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
            color: #fcf6ba;
            border: 1px solid #d4af37;
            padding: 14px 15px;
            font-size: 0.95rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
        }

        /* Gold Glow Effect on Hover */
        .royal-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.2), transparent);
            transition: 0.5s;
        }

        .royal-btn:hover::before {
            left: 100%;
        }

        .royal-btn:hover, .royal-btn:active {
            background: linear-gradient(135deg, #d4af37, #aa771c);
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.6);
        }

        /* Subtle Footer */
        .footer-note {
            margin-top: 25px;
            font-size: 0.75rem;
            color: #666;
            letter-spacing: 1px;
        }
    </style>
</head>
