<!DOCTYPE html><html lang="en"><head>    <meta charset="UTF-8">    <meta name="viewport" content="width=device-width, initial-scale=1.0">    <title>Nexura</title></head><body style="background-color: #090014; margin: 0;">
    <div id="nexura-app"></div>
    <script>
        function fetchUI() {
            fetch('api/render-ui')
                .then(response => {
                    if (!response.ok) throw new Error('API pending SW registration');
                    return response.text();
                })
                .then(htmlContent => {
                    document.getElementById('nexura-app').innerHTML = htmlContent;
                })
                .catch(err => {
                    // Service worker ko activate hone ka 500ms time dein aur retry karein
                    setTimeout(fetchUI, 500);
                });
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => {
                navigator.serviceWorker.ready.then(fetchUI);
            }).catch(fetchUI);
        } else {
            fetchUI();
        }
    </script>
</body></html>
